[alembic]
script_location = alembic
# Coloca a raiz do projeto no sys.path para o env.py conseguir fazer "import app".
prepend_sys_path = .
# Migrações ordenadas por data no nome do arquivo.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# A URL do banco NÃO fica aqui: o alembic/env.py a lê de app.config (variável DATABASE_URL).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
