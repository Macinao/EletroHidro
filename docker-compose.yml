services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?defina READONLY_DB_PASSWORD no .env (veja .env.example)}
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
    # Fuso das sessões do banco (now(), CURRENT_DATE, timestamptz -> date). Passado como parâmetro para
    # valer também num volume já criado, cuja configuração gravada na criação diz UTC.
    command: ["postgres", "-c", "timezone=${FUSO_HORARIO:-America/Sao_Paulo}", "-c", "log_timezone=${FUSO_HORARIO:-America/Sao_Paulo}"]
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro  # cria o usuário somente leitura
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # No compose o banco é alcançado pelo nome do serviço ("db"), não por localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_READONLY: postgresql+psycopg://eletrohidro_ro:${READONLY_DB_PASSWORD:?defina READONLY_DB_PASSWORD no .env}@db:5432/${POSTGRES_DB}
      # Opcionais: sem a chave, só o /ia/perguntar fica indisponível.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      # Fuso do negócio: define o "hoje" da API (vencimentos, filtros por dia, data enviada à IA).
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
    ports:
      - "8000:8000"
    healthcheck:  # "saudável" só depois de migrar e responder: `docker compose up --wait` passa a ser confiável
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    # Aplica as migrações e só então sobe a API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
